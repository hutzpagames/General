name: Revenue Leak Actor CI
on:
  push:
    paths:
      - "engines/revenue-leak-lead-finder/**"
      - ".github/workflows/revenue-leak-ci.yml"
  pull_request:
    paths:
      - "engines/revenue-leak-lead-finder/**"
      - ".github/workflows/revenue-leak-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/revenue-leak-lead-finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run validate
